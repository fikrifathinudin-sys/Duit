<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DuitKu — Student Financial Management</title>
<style>
:root{--bg:#f4f8f5;--card:#fff;--tx:#14201a;--mu:#66756d;--bd:#e2e9e4;--g:#16a34a;--gd:#0f7a37;--gl:#e7f6ec;--r:#dc2626;--rl:#fdecec;--a:#b45309;--al:#fff3dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--card:#18231d;--tx:#e8f0eb;--mu:#93a39a;--bd:#27352d;--gl:#133323;--rl:#3a1b1b;--al:#3a2e12;--a:#f5b94d;--g:#34d27a;--gd:#34d27a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1713;--card:#18231d;--tx:#e8f0eb;--mu:#93a39a;--bd:#27352d;--gl:#133323;--rl:#3a1b1b;--al:#3a2e12;--a:#f5b94d;--g:#34d27a;--gd:#34d27a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 90px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:22px;color:var(--gd)}.brand small{display:block;font-weight:500;font-size:11px;color:var(--mu)}
h2{margin:6px 0 12px;font-size:20px}h3{margin:0 0 10px;font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}.grid>.card{margin:0}
.two{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1fr 1fr}}
.lbl{font-size:12px;color:var(--mu)}.big{font-size:19px;font-weight:800;word-break:break-word}
.pos{color:var(--g)}.neg{color:var(--r)}
.hero{background:linear-gradient(135deg,#16a34a,#0f7a37);color:#fff;border:0}.hero .lbl{color:#d6f5e0}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);margin-top:4px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.btn.s{background:var(--gl);color:var(--gd)}.btn.d{background:var(--rl);color:var(--r)}.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 120px}.row .btn{flex:0 0 auto}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.tx:last-child{border:0}
.ic{width:38px;height:38px;border-radius:12px;background:var(--gl);display:grid;place-items:center;font-size:19px;flex:none}
.tx .m{flex:1;min-width:0}.tx .m b,.tx .m small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}small{color:var(--mu)}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--g);border-radius:9px}
.bar.w i{background:#f59e0b}.bar.o i{background:var(--r)}
.al{padding:10px 12px;border-radius:12px;margin-bottom:10px;font-size:14px}.al.w{background:var(--al);color:var(--a)}.al.o{background:var(--rl);color:var(--r)}.al.i{background:var(--gl);color:var(--gd)}
nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;padding:6px 0;font-size:10px;color:var(--mu);cursor:pointer}nav button span{display:block;font-size:18px}nav button.on{color:var(--gd);font-weight:700}
@media(min-width:900px){nav{top:0;right:auto;width:180px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:70px 8px}nav button{text-align:left;font-size:14px;padding:10px;border-radius:10px}nav button span{display:inline;margin-right:8px;font-size:16px}nav button.on{background:var(--gl)}.wrap{margin-left:200px;max-width:none;padding-right:24px}body{overflow-x:hidden}}
dialog{border:0;border-radius:18px;padding:18px;width:min(460px,94vw);background:var(--card);color:var(--tx);max-height:90vh}dialog::backdrop{background:#0008}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#14201a;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:50;max-width:90vw}#toast.on{opacity:1}
.tag{font-size:11px;background:var(--al);color:var(--a);border-radius:8px;padding:2px 7px}
canvas{max-height:260px}.empty{text-align:center;color:var(--mu);padding:20px}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1}
ul.t{margin:0;padding-left:18px}ul.t li{margin-bottom:6px}
#auth{position:fixed;inset:0;z-index:40;overflow:auto;background:linear-gradient(160deg,var(--gl),var(--bg) 60%);display:grid;place-items:center;padding:20px}#auth[hidden],nav[hidden]{display:none}
.ab{width:min(420px,100%);text-align:center}.ab .card{text-align:left}.logo{font-size:46px}.pw{display:flex;gap:6px;align-items:center}.pw button{margin-top:4px;flex:none}.ab a{color:var(--gd);font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="wrap" hidden>
<header><div class="brand">💚 DuitKu<small>Student Financial Management</small></div><div class="row" style="flex:0 1 auto;align-items:flex-end"><span id="greet" class="lbl" style="flex:0 0 auto"></span><label style="margin:0;flex:0 0 auto">Periode<input type="month" id="mp"></label><button class="btn d sm" onclick="logout()">Keluar</button></div></header>
<div id="app"></div>
</div>
<div id="auth" hidden></div><nav id="nav" hidden></nav><dialog id="dlg"></dialog><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
const INC=['Uang Saku','Gaji','Usaha','Freelance','Lainnya'],EXP=['Makanan','Transportasi','Pendidikan','Tempat Tinggal','Hiburan','Belanja','Kesehatan','Lainnya'];
const IC={'Uang Saku':'💵','Gaji':'💼','Usaha':'🏪','Freelance':'💻','Makanan':'🍜','Transportasi':'🚌','Pendidikan':'📚','Tempat Tinggal':'🏠','Hiburan':'🎬','Belanja':'🛍️','Kesehatan':'💊','Lainnya':'📦'};
const TIPS={'Makanan':'Coba masak sendiri atau bawa bekal, dan kurangi pesan antar.','Transportasi':'Manfaatkan transportasi umum atau berangkat bersama teman.','Pendidikan':'Cari buku bekas, e-book, atau pinjam di perpustakaan.','Tempat Tinggal':'Pertimbangkan patungan atau cek ulang biaya yang bisa dihemat.','Hiburan':'Tetapkan batas hiburan mingguan dan cari kegiatan gratis.','Belanja':'Tunda pembelian 24 jam dan bedakan kebutuhan dengan keinginan.','Kesehatan':'Manfaatkan layanan kesehatan kampus/BPJS bila tersedia.','Lainnya':'Rinci pengeluaran "Lainnya" supaya mudah dievaluasi.'};
const p2=n=>String(n).padStart(2,'0'),fmt=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),ym=d=>fmt(d).slice(0,7);
const rp=n=>(n<0?'-':'')+'Rp'+Math.round(Math.abs(n)).toLocaleString('id-ID');
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
let S=null,U=null,view='dash',month=ym(new Date()),F={q:'',type:'',cat:'',from:'',to:''},rmode='monthly',charts={};
const emptyS=n=>({name:n,initial:0,demo:false,budget:{total:0,cats:{}},tx:[],goals:[]});
function demo(){const n=new Date(),m=ym(n),d=x=>m+'-'+p2(Math.min(x,n.getDate()));let i=0;
const t=(x,ty,c,a,note)=>({id:'d'+(i++),type:ty,cat:c,amount:a,date:d(x),note,demo:1});
return{name:'Mahasiswa',initial:1000000,demo:true,budget:{total:1800000,cats:{Makanan:700000,Transportasi:250000,Hiburan:200000,Belanja:250000}},
tx:[t(1,'in','Uang Saku',1500000,'Kiriman orang tua'),t(8,'in','Freelance',350000,'Desain poster'),t(1,'out','Tempat Tinggal',500000,'Iuran kos'),t(2,'out','Makanan',85000,'Belanja mingguan'),t(3,'out','Transportasi',40000,'Ojek online'),t(4,'out','Pendidikan',120000,'Fotokopi & buku'),t(5,'out','Makanan',65000,'Makan bareng teman'),t(6,'out','Hiburan',70000,'Nonton film'),t(9,'out','Belanja',180000,'Kaos & sepatu'),t(10,'out','Makanan',90000,'Makan siang'),t(11,'out','Kesehatan',45000,'Vitamin'),t(12,'out','Transportasi',35000,'Bensin')],
goals:[{id:'g1',name:'Laptop Baru',target:5000000,saved:800000,deadline:fmt(new Date(n.getFullYear(),n.getMonth()+8,1))}]}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
function modal(h){$('dlg').innerHTML=h;$('dlg').showModal()}
function closeM(){if($('dlg').open)$('dlg').close()}
function ask(msg,fn){window._ok=fn;modal(`<h3>Konfirmasi</h3><p>${e(msg)}</p><div class="row"><button class="btn s" onclick="closeM()">Batal</button><button class="btn d" onclick="closeM();_ok()">Ya, lanjutkan</button></div>`)}
const inM=t=>t.date.slice(0,7)===month;
const sum=(a,ty)=>a.filter(t=>t.type===ty).reduce((s,t)=>s+t.amount,0);
const balance=()=>S.initial+sum(S.tx,'in')-sum(S.tx,'out');
function byCat(a){const o={};a.filter(t=>t.type==='out').forEach(t=>o[t.cat]=(o[t.cat]||0)+t.amount);return Object.entries(o).sort((a,b)=>b[1]-a[1])}
function chart(id,cfg){if(charts[id])charts[id].destroy();const c=$(id);if(!c)return;if(typeof Chart==='undefined'){c.outerHTML='<div class="empty">Grafik tidak dapat dimuat (cek koneksi internet).</div>';return}
Chart.defaults.color=getComputedStyle(document.documentElement).getPropertyValue('--mu')||'#666';cfg.options=Object.assign({responsive:true,maintainAspectRatio:false},cfg.options||{});charts[id]=new Chart(c,cfg)}
const money=v=>'Rp'+(v>=1e6?(v/1e6).toFixed(1)+'jt':v>=1e3?Math.round(v/1e3)+'rb':v);
function txRow(t,act){return`<div class="tx"><div class="ic">${IC[t.cat]||'📦'}</div><div class="m"><b>${e(t.cat)} ${t.demo?'<span class="tag">demo</span>':''}</b><small>${t.date} · ${e(t.note||'-')}</small></div><div style="text-align:right"><b class="${t.type==='in'?'pos':'neg'}">${t.type==='in'?'+':'-'}${rp(t.amount)}</b>${act?`<div><button class="btn s sm" onclick="txForm('${t.id}')">Edit</button> <button class="btn d sm" onclick="delTx('${t.id}')">Hapus</button></div>`:''}</div></div>`}
function budgetStatus(){const ex=S.tx.filter(t=>inM(t)&&t.type==='out'),out=[],tot=ex.reduce((s,t)=>s+t.amount,0);
if(S.budget.total>0)out.push({n:'Total bulanan',u:tot,b:S.budget.total});
const bc=Object.fromEntries(byCat(ex));Object.entries(S.budget.cats).forEach(([c,b])=>{if(b>0)out.push({n:c,u:bc[c]||0,b})});return out}
function warns(){return budgetStatus().filter(x=>x.u/x.b>=.8).map(x=>x.u>x.b?`<div class="al o">⚠️ Anggaran <b>${e(x.n)}</b> melebihi 100% (${rp(x.u)} dari ${rp(x.b)}).</div>`:`<div class="al w">⚠️ Anggaran <b>${e(x.n)}</b> sudah ${Math.round(x.u/x.b*100)}% terpakai.</div>`).join('')}
const V={
dash(){const a=S.tx.filter(inM),inc=sum(a,'in'),exp=sum(a,'out'),sv=S.goals.reduce((s,g)=>s+g.saved,0),rec=[...S.tx].sort((x,y)=>y.date.localeCompare(x.date)).slice(0,5);
let msg=!a.length?'Belum ada transaksi pada periode ini.':inc>=exp?`Bulan ini pemasukan lebih besar ${rp(inc-exp)} dari pengeluaran. Pertahankan!`:`Pengeluaran bulan ini melebihi pemasukan sebesar ${rp(exp-inc)}. Tinjau kembali pengeluaranmu.`;
$('app').innerHTML=`${warns()}<div class="grid"><div class="card hero"><div class="lbl">Total Saldo</div><div class="big">${rp(balance())}</div></div><div class="card"><div class="lbl">Pemasukan bulan ini</div><div class="big pos">${rp(inc)}</div></div><div class="card"><div class="lbl">Pengeluaran bulan ini</div><div class="big neg">${rp(exp)}</div></div><div class="card"><div class="lbl">Uang ditabung</div><div class="big">${rp(sv)}</div></div></div>
<div class="card" style="margin-top:12px"><h3>Ringkasan</h3><div class="al i" style="margin:0">${msg}</div></div>
<div class="two"><div class="card"><h3>Pemasukan vs Pengeluaran (per minggu)</h3><div style="height:240px"><canvas id="c1"></canvas></div></div><div class="card"><h3>Transaksi Terbaru</h3>${rec.length?rec.map(t=>txRow(t)).join(''):'<div class="empty">Belum ada transaksi.</div>'}</div></div>`;
const w=[0,0,0,0,0],x=[0,0,0,0,0];a.forEach(t=>{const k=Math.min(4,Math.floor((+t.date.slice(8)-1)/7));(t.type==='in'?w:x)[k]+=t.amount});
chart('c1',{type:'bar',data:{labels:['Mgg 1','Mgg 2','Mgg 3','Mgg 4','Mgg 5'],datasets:[{label:'Pemasukan',data:w,backgroundColor:'#16a34a'},{label:'Pengeluaran',data:x,backgroundColor:'#ef4444'}]},options:{scales:{y:{ticks:{callback:money}}}}})},
tx(){const cats=[...new Set([...INC,...EXP])];
$('app').innerHTML=`<div class="row" style="margin-bottom:10px"><h2 style="margin:0;flex:1">Transaksi</h2><button class="btn" onclick="txForm()">+ Tambah</button></div>
<div class="card"><div class="row"><label>Cari catatan<input id="fq" value="${e(F.q)}" placeholder="Cari…" oninput="F.q=this.value;updList()"></label><label>Jenis<select id="ft" onchange="F.type=this.value;updList()"><option value="">Semua</option><option value="in" ${F.type==='in'?'selected':''}>Pemasukan</option><option value="out" ${F.type==='out'?'selected':''}>Pengeluaran</option></select></label><label>Kategori<select onchange="F.cat=this.value;updList()"><option value="">Semua</option>${cats.map(c=>`<option ${F.cat===c?'selected':''}>${c}</option>`).join('')}</select></label></div>
<div class="row"><label>Dari tanggal<input type="date" value="${F.from}" onchange="F.from=this.value;updList()"></label><label>Sampai<input type="date" value="${F.to}" onchange="F.to=this.value;updList()"></label><button class="btn s" onclick="F={q:'',type:'',cat:'',from:'',to:''};V.tx()">Reset</button></div></div>
<div class="card" id="txlist"></div>`;updList()}
,bud(){const st=budgetStatus();
$('app').innerHTML=`<h2>Anggaran — ${month}</h2>${warns()}<div class="card"><h3>Atur Anggaran</h3><label>Batas pengeluaran bulanan (Rp)<input type="number" min="0" id="bt" value="${S.budget.total||''}" placeholder="mis. 1800000"></label><div class="lbl" style="margin-bottom:6px">Anggaran per kategori (kosongkan jika tidak dipakai)</div><div class="row">${EXP.map((c,i)=>`<label>${IC[c]} ${c}<input type="number" min="0" id="bc${i}" value="${S.budget.cats[c]||''}"></label>`).join('')}</div><button class="btn" onclick="saveBud()">Simpan Anggaran</button></div>
<div class="card"><h3>Penggunaan Anggaran</h3>${st.length?st.map(x=>{const pc=x.u/x.b*100,cl=pc>100?'o':pc>=80?'w':'';return`<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><b>${e(x.n)}</b><span>${Math.round(pc)}%</span></div><div class="bar ${cl}"><i style="width:${Math.min(100,pc)}%"></i></div><small>${rp(x.u)} dari ${rp(x.b)} · ${x.u>x.b?'Lebih '+rp(x.u-x.b):'Sisa '+rp(x.b-x.u)}</small></div>`}).join(''):'<div class="empty">Belum ada anggaran yang diatur.</div>'}</div>`},
goal(){$('app').innerHTML=`<div class="row" style="margin-bottom:10px"><h2 style="margin:0;flex:1">Target Tabungan</h2><button class="btn" onclick="goalForm()">+ Target</button></div>
${S.goals.length?S.goals.map(g=>{const pc=Math.min(100,g.saved/g.target*100),rem=g.target-g.saved,days=Math.ceil((new Date(g.deadline+'T00:00:00')-new Date(fmt(new Date())+'T00:00:00'))/864e5);
let need=rem<=0?'🎉 Target tercapai!':days<=0?'Tenggat sudah lewat. Sisa '+rp(rem)+'.':`Perlu menyisihkan ±<b>${rp(rem/days)}</b>/hari atau ±<b>${rp(rem/(days/30.44))}</b>/bulan (${days} hari lagi).`;
return`<div class="card"><div class="row" style="justify-content:space-between"><b>🐖 ${e(g.name)}</b><span>${Math.round(pc)}%</span></div><div class="bar"><i style="width:${pc}%"></i></div><small>${rp(g.saved)} dari ${rp(g.target)} · tenggat ${g.deadline}</small><p style="margin:8px 0">${need}</p><div class="row"><button class="btn sm" onclick="fundForm('${g.id}')">+ Tambah Dana</button><button class="btn s sm" onclick="goalForm('${g.id}')">Edit</button><button class="btn d sm" onclick="delGoal('${g.id}')">Hapus</button></div></div>`}).join(''):'<div class="card empty">Belum ada target tabungan. Buat target pertamamu!</div>'}
<small>Catatan: dana target bersifat pencatatan terpisah dan tidak mengubah saldo transaksi.</small>`},
rep(){const n=new Date();let txs,label,labels,d1,d2;
if(rmode==='weekly'){const days=[];for(let i=6;i>=0;i--){const d=new Date(n);d.setDate(n.getDate()-i);days.push(fmt(d))}txs=S.tx.filter(t=>days.includes(t.date));label='7 hari terakhir';labels=days.map(x=>x.slice(5));d1=days.map(d=>sum(txs.filter(t=>t.date===d),'in'));d2=days.map(d=>sum(txs.filter(t=>t.date===d),'out'))}
else{txs=S.tx.filter(inM);label='Bulan '+month;labels=['Mgg 1','Mgg 2','Mgg 3','Mgg 4','Mgg 5'];d1=[0,0,0,0,0];d2=[0,0,0,0,0];txs.forEach(t=>{(t.type==='in'?d1:d2)[Math.min(4,Math.floor((+t.date.slice(8)-1)/7))]+=t.amount})}
const inc=sum(txs,'in'),exp=sum(txs,'out'),cs=byCat(txs);
$('app').innerHTML=`<h2>Laporan</h2><div class="seg"><button class="btn ${rmode==='weekly'?'':'s'}" onclick="rmode='weekly';V.rep()">Mingguan</button><button class="btn ${rmode==='monthly'?'':'s'}" onclick="rmode='monthly';V.rep()">Bulanan</button></div>
<div class="grid"><div class="card"><div class="lbl">Pemasukan</div><div class="big pos">${rp(inc)}</div></div><div class="card"><div class="lbl">Pengeluaran</div><div class="big neg">${rp(exp)}</div></div><div class="card"><div class="lbl">Selisih</div><div class="big ${inc>=exp?'pos':'neg'}">${rp(inc-exp)}</div></div><div class="card"><div class="lbl">Periode</div><div class="big" style="font-size:15px">${label}</div></div></div>
${txs.length?`<div class="al i" style="margin-top:12px">${cs.length?`Pengeluaran terbesar: <b>${e(cs[0][0])}</b> (${rp(cs[0][1])}, ${Math.round(cs[0][1]/exp*100)}% dari total).`:'Belum ada pengeluaran.'}</div>`:''}
<div class="two" style="margin-top:12px"><div class="card"><h3>Arus Kas</h3><div style="height:240px"><canvas id="c2"></canvas></div></div><div class="card"><h3>Pengeluaran per Kategori</h3>${cs.length?'<div style="height:240px"><canvas id="c3"></canvas></div>':'<div class="empty">Belum ada data pengeluaran.</div>'}</div></div>
<button class="btn" onclick="exportCSV()">⬇️ Ekspor CSV</button>`;
chart('c2',{type:'bar',data:{labels,datasets:[{label:'Pemasukan',data:d1,backgroundColor:'#16a34a'},{label:'Pengeluaran',data:d2,backgroundColor:'#ef4444'}]},options:{scales:{y:{ticks:{callback:money}}}}});
if(cs.length)chart('c3',{type:'doughnut',data:{labels:cs.map(x=>x[0]),datasets:[{data:cs.map(x=>x[1]),backgroundColor:['#16a34a','#22c55e','#86efac','#f59e0b','#ef4444','#6366f1','#06b6d4','#94a3b8']}]},options:{plugins:{legend:{position:'bottom'}}}})},
ana(){const a=S.tx.filter(inM),inc=sum(a,'in'),exp=sum(a,'out'),cs=byCat(a);let h=`<h2>Analisis — ${month}</h2>`;
if(!a.length){$('app').innerHTML=h+'<div class="card empty">Belum ada transaksi pada periode ini, sehingga analisis belum bisa dibuat.</div>';return}
let L=[];
if(cs.length){L.push(`Kategori pengeluaran terbesar: <b>${e(cs[0][0])}</b> sebesar ${rp(cs[0][1])} (${Math.round(cs[0][1]/exp*100)}% dari pengeluaran).`);L.push('💡 Saran: '+TIPS[cs[0][0]]);if(cs[1])L.push(`Kategori terbesar kedua: ${e(cs[1][0])} (${rp(cs[1][1])}).`)}
if(inc>0){const r=(inc-exp)/inc*100;L.push(r>=0?`Kamu menyisihkan ±${Math.round(r)}% dari pemasukan bulan ini (${rp(inc-exp)}).`:`Pengeluaran melebihi pemasukan ${rp(exp-inc)}. Coba kurangi kategori terbesar terlebih dahulu.`)}else L.push('Belum ada pemasukan tercatat pada periode ini.');
const st=budgetStatus();
if(!st.length)L.push('Anggaran belum diatur. Atur batas bulanan di menu Anggaran agar pengeluaran lebih terkontrol.');
else st.forEach(x=>L.push(x.u>x.b?`❌ ${e(x.n)}: melebihi anggaran ${rp(x.u-x.b)}.`:x.u/x.b>=.8?`⚠️ ${e(x.n)}: ${Math.round(x.u/x.b*100)}% terpakai, sisa ${rp(x.b-x.u)}.`:`✅ ${e(x.n)}: masih aman (${Math.round(x.u/x.b*100)}% terpakai).`));

<div class="card"><h3>Data</h3><p>🔒 Data disimpan di akun Supabase kamu dan hanya bisa diakses oleh akunmu. Aplikasi tidak meminta PIN atau info rekening.</p><div class="row">${S.demo?'<button class="btn s" onclick="clearDemo()">Hapus data demo</button>':''}<button class="btn d" onclick="ask('Hapus SELURUH data? Tindakan ini tidak dapat dibatalkan.',wipe)">Hapus semua data</button></div></div>`}
};
function updList(){const a=fl().sort((x,y)=>y.date.localeCompare(x.date));$('txlist').innerHTML=a.length?`<small>${a.length} transaksi</small>`+a.map(t=>txRow(t,1)).join(''):'<div class="empty">Tidak ada transaksi yang cocok.</div>'}
function fl(){const q=F.q.toLowerCase();return S.tx.filter(t=>(!F.type||t.type===F.type)&&(!F.cat||t.cat===F.cat)&&(!F.from||t.date>=F.from)&&(!F.to||t.date<=F.to)&&(!q||(t.note||'').toLowerCase().includes(q)||t.cat.toLowerCase().includes(q)))}
function txForm(id){const t=S.tx.find(x=>x.id===id)||{type:'out',cat:'Makanan',amount:'',date:fmt(new Date()),note:''};
modal(`<h3>${id?'Edit':'Tambah'} Transaksi</h3><form onsubmit="saveTx(event,'${id||''}')"><label>Jenis<select id="f_t" onchange="catOpts()"><option value="in" ${t.type==='in'?'selected':''}>Pemasukan</option><option value="out" ${t.type==='out'?'selected':''}>Pengeluaran</option></select></label><label>Kategori<select id="f_c"></select></label><label>Nominal (Rp)<input id="f_a" type="number" min="1" step="1" required value="${t.amount}"></label><label>Tanggal<input id="f_d" type="date" required value="${t.date}"></label><label>Catatan<input id="f_n" maxlength="100" value="${e(t.note)}"></label><div id="f_e" class="neg"></div><div class="row"><button type="button" class="btn s" onclick="closeM()">Batal</button><button class="btn">Simpan</button></div></form>`);catOpts(t.cat)}
function catOpts(sel){const l=$('f_t').value==='in'?INC:EXP;$('f_c').innerHTML=l.map(c=>`<option ${c===sel?'selected':''}>${c}</option>`).join('')}
function saveTx(ev,id){ev.preventDefault();const a=parseFloat($('f_a').value),d=$('f_d').value,er=$('f_e');
if(!isFinite(a)||a<=0||a>1e12){er.textContent='Nominal harus angka lebih dari 0.';return}if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){er.textContent='Tanggal tidak valid.';return}
const o={type:$('f_t').value,cat:$('f_c').value,amount:Math.round(a),date:d,note:$('f_n').value.trim()};
if(id){Object.assign(S.tx.find(x=>x.id===id),o)}else S.tx.push({id:'t'+Date.now()+Math.random().toString(36).slice(2,6),...o});
save();closeM();toast('Transaksi disimpan');render()}
function delTx(id){ask('Hapus transaksi ini?',()=>{S.tx=S.tx.filter(t=>t.id!==id);save();toast('Transaksi dihapus');render()})}
function saveBud(){const g=id=>{const v=parseFloat($(id).value);return isFinite(v)&&v>0?Math.round(v):0};S.budget.total=g('bt');S.budget.cats={};EXP.forEach((c,i)=>{const v=g('bc'+i);if(v)S.budget.cats[c]=v});save();toast('Anggaran disimpan');render()}
function goalForm(id){const g=S.goals.find(x=>x.id===id)||{name:'',target:'',saved:0,deadline:''};
modal(`<h3>${id?'Edit':'Buat'} Target</h3><form onsubmit="saveGoal(event,'${id||''}')"><label>Nama target<input id="g_n" required maxlength="40" value="${e(g.name)}"></label><label>Jumlah target (Rp)<input id="g_t" type="number" min="1" required value="${g.target}"></label><label>Sudah terkumpul (Rp)<input id="g_s" type="number" min="0" value="${g.saved}"></label><label>Tenggat<input id="g_d" type="date" required value="${g.deadline}"></label><div id="f_e" class="neg"></div><div class="row"><button type="button" class="btn s" onclick="closeM()">Batal</button><button class="btn">Simpan</button></div></form>`)}
function saveGoal(ev,id){ev.preventDefault();const t=parseFloat($('g_t').value),s=parseFloat($('g_s').value||0);if(!(t>0)||!(s>=0)){$('f_e').textContent='Nominal tidak valid.';return}
const o={name:$('g_n').value.trim(),target:Math.round(t),saved:Math.round(s),deadline:$('g_d').value};if(!o.name){$('f_e').textContent='Nama wajib diisi.';return}
if(id)Object.assign(S.goals.find(x=>x.id===id),o);else S.goals.push({id:'g'+Date.now(),...o});save();closeM();toast('Target disimpan');render()}
function fundForm(id){modal(`<h3>Tambah Dana</h3><form onsubmit="addFund(event,'${id}')"><label>Nominal (Rp)<input id="fa" type="number" min="1" required></label><div id="f_e" class="neg"></div><div class="row"><button type="button" class="btn s" onclick="closeM()">Batal</button><button class="btn">Tambah</button></div></form>`)}
function addFund(ev,id){ev.preventDefault();const a=parseFloat($('fa').value);if(!(a>0)){$('f_e').textContent='Nominal harus lebih dari 0.';return}S.goals.find(g=>g.id===id).saved+=Math.round(a);save();closeM();toast('Dana ditambahkan');render()}
function delGoal(id){ask('Hapus target ini?',()=>{S.goals=S.goals.filter(g=>g.id!==id);save();render()})}
function saveSet(){const i=parseFloat($('si').value);if(!isFinite(i)||i<0){toast('Saldo awal tidak valid');return}S.name=$('sn').value.trim()||'Mahasiswa';U.name=S.name;S.initial=Math.round(i);save();sb.auth.updateUser({data:{name:S.name}}).catch(()=>{});toast('Pengaturan disimpan');render()}
function clearDemo(){ask('Hapus data demo dan mulai dari kosong?',()=>{S=emptyS(S.name);save();render()})}
function wipe(){S=emptyS(U.name);save();render();toast('Semua data dihapus')}
function csvText(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"';return['Tanggal,Jenis,Kategori,Nominal,Catatan',...[...S.tx].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type==='in'?'Pemasukan':'Pengeluaran',t.cat,t.amount,q(t.note||'')].join(','))].join('\n')}
function exportCSV(){if(!S.tx.length){toast('Belum ada transaksi untuk diekspor');return}const c=csvText();
modal(`<h3>Ekspor CSV</h3><textarea id="csv" rows="8" readonly>${e(c)}</textarea><div class="row" style="margin-top:10px"><button class="btn s" onclick="closeM()">Tutup</button><button class="btn s" onclick="copyCSV()">Salin</button><button class="btn" onclick="dlCSV()">Unduh</button></div>`)}
function copyCSV(){const t=$('csv');t.select();try{navigator.clipboard.writeText(t.value);toast('CSV disalin')}catch(x){document.execCommand('copy');toast('CSV disalin')}}
function dlCSV(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csvText()],{type:'text/csv'}));a.download='duitku-transaksi.csv';a.click();toast('Mengunduh…')}catch(x){toast('Unduh diblokir, gunakan tombol Salin')}}
const NAV=[['dash','🏠','Beranda'],['tx','🧾','Transaksi'],['bud','🎯','Anggaran'],['goal','🐖','Tabungan'],['rep','📊','Laporan'],['ana','💡','Analisis'],['set','⚙️','Profil']];
function render(){if(!U||!S){showAuth('land');return}$('auth').hidden=true;document.querySelector('.wrap').hidden=false;$('nav').hidden=false;$('greet').textContent='Halo, '+U.name;$('nav').innerHTML=NAV.map(n=>`<button class="${n[0]===view?'on':''}" onclick="view='${n[0]}';render();scrollTo(0,0)"><span>${n[1]}</span>${n[2]}</button>`).join('');
Object.values(charts).forEach(c=>c.destroy());charts={};V[view]();
if(view==='dash'&&!S.tx.length&&!S.demo)$('app').insertAdjacentHTML('afterbegin','<div class="al i">👋 Akunmu masih kosong. Mulai dengan menambah transaksi, atau <a href="#" onclick="loadDemo();return false" style="color:inherit;font-weight:700">isi dengan data contoh</a> untuk mencoba aplikasi.</div>');
if(S.demo)$('app').insertAdjacentHTML('afterbegin',`<div class="al w">🧪 Ini <b>data demo</b> (saldo awal Rp1.000.000). <a href="#" onclick="clearDemo();return false" style="color:inherit;font-weight:700">Hapus &amp; mulai kosong</a></div>`)}
$('mp').value=month;$('mp').onchange=function(){if(this.value){month=this.value;render()}};

/* ===== SUPABASE ===== */
const SUPABASE_URL='https://vztykwadqshikinscjxn.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_v5nd_Zrtbi2zRvWx6E-TvQ_l_BejD-Y';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

async function sessionUser(){
  try{
    const{data:{session},error}=await sb.auth.getSession();
    if(error||!session){U=null;S=null;return null}
    const u=session.user;
    U={id:u.id,email:u.email,name:(u.user_metadata&&u.user_metadata.name)||'Mahasiswa'};
    await loadFromSupabase();
    return U;
  }catch(x){U=null;S=null;return null}
}
async function loadFromSupabase(){
  try{
    const{data,error}=await sb.from('user_data').select('data').eq('user_id',U.id).maybeSingle();
    if(error)throw error;
    if(data&&data.data&&Array.isArray(data.data.tx)){S=data.data}
    else{S=emptyS(U.name);await saveToSupabase()}
  }catch(x){S=emptyS(U.name);toast('Gagal memuat data dari server')}
}
async function saveToSupabase(){
  if(!U||!S)return;
  try{
    const{error}=await sb.from('user_data').upsert({user_id:U.id,data:S,updated_at:new Date().toISOString()},{onConflict:'user_id'});
    if(error){console.error(error);toast('Gagal menyimpan ke server')}
  }catch(x){toast('Gagal menyinkronkan ke server')}
}
function save(){saveToSupabase()}
function loadDemo(){S=Object.assign(demo(),{name:U.name});save();render()}

const pwf=(id,l,ac)=>`<label>${l}<div class="pw"><input id="${id}" type="password" autocomplete="${ac}"><button type="button" class="btn s sm" onclick="tp('${id}',this)">Lihat</button></div></label>`;
function tp(id,b){const i=$(id);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Lihat':'Sembunyi'}
const A={
land:()=>`<div class="ab"><div class="logo">💚</div><h1 style="margin:0;color:var(--gd)">DuitKu</h1><div class="lbl">Student Financial Management</div><p style="font-size:18px;font-weight:600;margin:14px 0 22px">Kelola Uangmu, Raih Masa Depanmu.</p><div class="card"><button class="btn" style="width:100%;margin-bottom:8px" onclick="showAuth('login')">Masuk</button><button class="btn s" style="width:100%" onclick="showAuth('reg')">Daftar Sekarang</button></div><small>Terhubung secara aman dengan Supabase Server.</small></div>`,
login:()=>`<div class="ab"><div class="logo">💚</div><h2>Masuk ke DuitKu</h2><div class="card"><form novalidate onsubmit="doLogin(event)"><label>Email<input id="a_e" type="email" autocomplete="email" placeholder="nama@email.com"></label>${pwf('a_p','Kata sandi','current-password')}<div id="a_er" class="neg" style="margin-bottom:8px" role="alert"></div><button id="a_b" class="btn" style="width:100%">Masuk</button></form></div><p>Belum punya akun? <a onclick="showAuth('reg')">Daftar sekarang</a></p><a onclick="showAuth('land')">← Kembali</a></div>`,
reg:()=>`<div class="ab"><div class="logo">💚</div><h2>Buat Akun DuitKu</h2><div class="card"><form novalidate onsubmit="doReg(event)"><label>Nama lengkap<input id="r_n" maxlength="50" autocomplete="name"></label><label>Email<input id="r_e" type="email" autocomplete="email"></label>${pwf('r_p','Kata sandi (min. 8 karakter)','new-password')}${pwf('r_c','Konfirmasi kata sandi','new-password')}<div id="a_er" class="neg" style="margin-bottom:8px" role="alert"></div><button id="a_b" class="btn" style="width:100%">Daftar</button></form></div><p>Sudah punya akun? <a onclick="showAuth('login')">Masuk</a></p><a onclick="showAuth('land')">← Kembali</a></div>`
};
function showAuth(s){closeM();document.querySelector('.wrap').hidden=true;$('nav').hidden=true;const a=$('auth');a.hidden=false;a.innerHTML=A[s]();a.scrollTop=0}
function busy(on,t){const b=$('a_b');b.disabled=on;b.textContent=on?'Memproses…':t}

async function doLogin(ev){
  ev.preventDefault();
  const email=$('a_e').value.trim(),password=$('a_p').value,er=$('a_er');
  er.textContent='';
  if(!email||!password){er.textContent='Email dan kata sandi wajib diisi.';return}
  busy(true,'Masuk');
  try{
    const{data,error}=await sb.auth.signInWithPassword({email,password});
    if(error){er.textContent=error.message==='Invalid login credentials'?'Email atau kata sandi salah.':error.message;busy(false,'Masuk');return}
    U={id:data.user.id,email:data.user.email,name:(data.user.user_metadata&&data.user.user_metadata.name)||'Mahasiswa'};
    await loadFromSupabase();
    view='dash';render();toast('Selamat datang kembali!');
  }catch(x){er.textContent='Gagal terhubung ke server.';busy(false,'Masuk')}
}
async function doReg(ev){
  ev.preventDefault();
  const name=$('r_n').value.trim(),email=$('r_e').value.trim(),password=$('r_p').value,er=$('a_er');
  er.textContent='';
  if(name.length<2){er.textContent='Nama lengkap minimal 2 karakter.';return}
  if(!email){er.textContent='Email wajib diisi.';return}
  if(password.length<8){er.textContent='Kata sandi minimal 8 karakter.';return}
  if(password!==$('r_c').value){er.textContent='Konfirmasi kata sandi tidak cocok.';return}
  busy(true,'Daftar');
  try{
    const{data,error}=await sb.auth.signUp({email,password,options:{data:{name}}});
    if(error){er.textContent=error.message;busy(false,'Daftar');return}
    if(!data.session){er.style.color='var(--gd)';er.textContent='Cek email untuk konfirmasi, lalu masuk.';busy(false,'Daftar');return}
    U={id:data.user.id,email:data.user.email,name};
    S=emptyS(name);await saveToSupabase();
    view='dash';render();toast('Registrasi berhasil! Selamat datang, '+name+'!');
  }catch(x){er.textContent='Registrasi gagal.';busy(false,'Daftar')}
}
async function logout(){
  try{await sb.auth.signOut()}catch(x){}
  U=null;S=null;
  Object.values(charts).forEach(c=>c.destroy());
  charts={};F={q:'',type:'',cat:'',from:'',to:''};
  showAuth('land');toast('Anda telah keluar');
}
(async()=>{await sessionUser();render()})();
